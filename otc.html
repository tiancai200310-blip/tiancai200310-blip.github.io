<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>C2C快捷交易</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #12161A; color: #EAECEF; font-size: 14px; padding-bottom: 70px; padding-top: env(safe-area-inset-top); }
        .otc-header { padding: 16px; background-color: #171E26; border-bottom: 1px solid #1F2630; display: flex; justify-content: space-between; }
        .toggle-box { display: flex; gap: 16px; font-size: 18px; font-weight: bold; }
        .toggle-item.active { color: #F0B90B; border-bottom: 2px solid #F0B90B; padding-bottom: 4px; }
        
        .merchant-card { background-color: #171E26; margin: 12px 16px; padding: 16px; border-radius: 6px; border: 1px solid #1F2630; display: flex; flex-direction: column; gap: 10px; }
        .m-top { display: flex; justify-content: space-between; align-items: center; }
        .m-name { font-weight: bold; color: #FFF; display: flex; align-items: center; gap: 4px; }
        .m-badge { color: #F0B90B; font-size: 12px; }
        .m-history { font-size: 11px; color: #848E9C; }
        .m-mid { display: flex; justify-content: space-between; font-size: 12px; color: #848E9C; margin: 4px 0; }
        .m-price { font-size: 20px; font-weight: bold; color: #0ECB81; }
        .buy-btn { background-color: #0ECB81; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .footer-navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #171E26; border-top: 1px solid #1F2630; display: flex; justify-content: space-around; align-items: center; padding-top: 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #848E9C; text-decoration: none; }
        .nav-item.active { color: #F0B90B; }
        .nav-icon { font-size: 18px; }
        .nav-text { font-size: 11px; }
    </style>
</head>
<body>

    <div class="otc-header">
        <div class="toggle-box">
            <span class="toggle-item active">我要买币</span>
            <span class="toggle-item" style="color: #474D57;">我要卖币</span>
        </div>
        <span style="color: #F0B90B; font-weight: bold;">CNY ▾</span>
    </div>

    <!-- 承兑商 1 -->
    <div class="merchant-card">
        <div class="m-top">
            <div class="m-name">🛡️ 诚信金牌资本 <span class="m-badge">V</span></div>
            <span class="m-history">4,821 单 | 99.8% 成交</span>
        </div>
        <div class="m-mid">
            <div>限额: 2,000 - 50,000 CNY<br><span style="margin-top:4px; display:inline-block;">支付方式: 银行卡/支付宝</span></div>
            <div style="text-align: right;"><span class="m-price">7.32</span> <span style="font-size:11px;color:#848E9C;">CNY/USDT</span></div>
        </div>
        <button class="buy-btn" onclick="window.location.href='recharge.html'">购买 USDT</button>
    </div>

    <!-- 承兑商 2 -->
    <div class="merchant-card">
        <div class="m-top">
            <div class="m-name">🛡️ 环球快捷海外入金</div>
            <span class="m-history">12,450 单 | 100% 成交</span>
        </div>
        <div class="m-mid">
            <div>限额: 500 - 100,000 CNY<br><span style="margin-top:4px; display:inline-block;">支付方式: 国际电汇/各大银行</span></div>
            <div style="text-align: right;"><span class="m-price">7.34</span> <span style="font-size:11px;color:#848E9C;">CNY/USDT</span></div>
        </div>
        <button class="buy-btn" onclick="window.location.href='recharge.html'">购买 USDT</button>
    </div>

    <div class="footer-navbar">
        <a href="market.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-text">行情</span></a>
        <a href="otc.html" class="nav-item active"><span class="nav-icon">💳</span><span class="nav-text">法币交易</span></a>
        <a href="index.html" class="nav-item"><span class="nav-icon">📈</span><span class="nav-text">合约交易</span></a>
        <a href="recharge.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-text">资产</span></a>
    </div>

</body>
</html>
