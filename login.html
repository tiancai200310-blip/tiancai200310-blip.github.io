<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #12161A;
            color: #EAECEF;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 24px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            font-size: 20px;
            color: #848E9C;
        }
        .close-btn {
            cursor: pointer;
            text-decoration: none;
            color: #848E9C;
        }
        .welcome-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #FFF;
        }
        .welcome-sub {
            font-size: 14px;
            color: #848E9C;
            margin-bottom: 32px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            font-size: 13px;
            color: #848E9C;
        }
        .input-wrapper {
            background-color: #1F2630;
            border: 1px solid transparent;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        .input-wrapper:focus-within {
            border-color: #F0B90B;
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #EAECEF;
            padding: 14px 0;
            font-size: 16px;
        }
        .forgot-link {
            text-align: right;
            font-size: 13px;
            color: #F0B90B;
            text-decoration: none;
            margin-top: -8px;
        }
        .submit-btn {
            background-color: #F0B90B;
            color: #12161A;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
        }
        .submit-btn:active {
            background-color: #C99A09;
        }
        .footer-links {
            margin-top: auto;
            text-align: center;
            font-size: 14px;
            color: #848E9C;
            padding-bottom: 20px;
        }
        .footer-links a {
            color: #F0B90B;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="close-btn">✕</a>
        <span style="font-size: 14px; color: #F0B90B; cursor: pointer;">在线客服</span>
    </div>

    <div class="welcome-title">欢迎登录</div>
    <div class="welcome-sub">请输入您的账号进行永续合约交易</div>

    <div class="login-form">
        <div class="input-group">
            <label>手机号 / 邮箱</label>
            <div class="input-wrapper">
                <input type="text" placeholder="请输入手机号或邮箱账号" id="username">
            </div>
        </div>

        <div class="input-group">
            <label>登录密码</label>
            <div class="input-wrapper">
                <input type="password" placeholder="请输入密码" id="password">
            </div>
        </div>

        <a href="#" class="forgot-link">忘记密码？</a>

        <a href="index.html" class="submit-btn" onclick="alert('登录成功！正在前往交易大厅...')">安全登录</a>
    </div>

    <div class="footer-links">
        还没有账号？ <a href="#" onclick="alert('海外注册通道已开启，请联系客服获取邀请码')">立即注册</a>
    </div>

</body>
</html>
