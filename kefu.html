<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎登录</title>
    <!-- 引入 Supabase 官方云端数据库前端连接库 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #12161A; color: #EAECEF; display: flex; flex-direction: column; height: 100vh; padding: 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; font-size: 20px; color: #848E9C; }
        .close-btn { cursor: pointer; text-decoration: none; color: #848E9C; }
        .welcome-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; color: #FFF; }
        .welcome-sub { font-size: 14px; color: #848E9C; margin-bottom: 32px; }
        .login-form { display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 13px; color: #848E9C; }
        .input-wrapper { background-color: #1F2630; border: 1px solid transparent; border-radius: 4px; display: flex; align-items: center; padding: 0 12px; }
        .input-wrapper:focus-within { border-color: #F0B90B; }
        .input-wrapper input { width: 100%; background: transparent; border: none; outline: none; color: #EAECEF; padding: 14px 0; font-size: 16px; }
        .submit-btn { background-color: #F0B90B; color: #12161A; border: none; padding: 14px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="close-btn">✕</a>
        <span style="font-size: 14px; color: #F0B90B; cursor: pointer;">安全防线</span>
    </div>

    <div class="welcome-title">欢迎登录</div>
    <div class="welcome-sub">请输入您的账号进行全仓远期合约交易</div>

    <div class="login-form">
        <div class="input-group">
            <label>手机号 / 邮箱</label>
            <div class="input-wrapper">
                <input type="text" placeholder="请输入手机号或邮箱账号" id="account-input">
            </div>
        </div>
        <div class="input-group">
            <label>登录密码</label>
            <div class="input-wrapper">
                <input type="password" placeholder="请输入密码" id="password-input">
            </div>
        </div>
        <button class="submit-btn" onclick="executeRealLogin()">安全登录</button>
    </div>

    <script>
        // 🛠️ 关键配置：请把下面的两行换成你在 Supabase 后台拿到的真实 URL 和 Key
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "你的anon_public_key";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function executeRealLogin() {
            const account = document.getElementById('account-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if(!account || !password) { alert('请输入完整的账号和密码！'); return; }
            
            try {
                // 智能数据库逻辑：检查用户是否存在，不存在则直接自动在云端数据库创建这个账号
                const { data, error } = await supabase.from('users').select('*').eq('account', account);
                
                let targetBalance = "12850.00";
                if (data && data.length > 0) {
                    targetBalance = data[0].balance; // 如果是老用户，直接读取他之前在后台的真实余额
                } else {
                    // 如果是全新用户，直接在云端数据库注册，并初始化赠送 12,850 美金
                    await supabase.from('users').insert([{ account: account, password: password, balance: targetBalance }]);
                }

                // 将登录状态同步存在用户的手机浏览器缓存中，供主页读取
                localStorage.setItem('isLogin', 'true');
                localStorage.setItem('userAccount', account);
                localStorage.setItem('fakeBalance', targetBalance);
                
                alert('系统安全防线验证成功！正在同步建立全球分布式加密资产通道...');
                window.location.href = 'index.html';
            } catch (e) {
                alert('分布式服务器通信限制，正自动通过本地离线安全策略登录...');
                localStorage.setItem('isLogin', 'true');
                localStorage.setItem('userAccount', account);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
