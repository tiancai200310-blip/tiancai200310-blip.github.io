<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球永续合约交易系统</title>
    <!-- 关联 PWA 手机 App 配置文件 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #12161A;
            color: #EAECEF;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 顶部导航与搜索 */
        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #1F2630;
            background-color: #171E26;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .symbol-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .symbol-name {
            font-size: 18px;
            font-weight: bold;
        }
        .symbol-change {
            font-size: 12px;
            color: #0ECB81;
            background: rgba(14, 203, 129, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        /* 搜索框样式 */
        .search-box {
            background-color: #1F2630;
            border: 1px solid #2B3139;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 6px 12px;
        }
        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #EAECEF;
            font-size: 13px;
        }
        /* 主体滚动区 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 30px;
        }
        /* 简易K线图区域 */
        .chart-section {
            height: 140px;
            background-color: #171E26;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #1F2630;
            position: relative;
        }
        .chart-placeholder {
            color: #474D57;
            font-size: 12px;
            text-align: center;
        }
        .price-ticker {
            position: absolute;
            top: 12px;
            left: 16px;
        }
        .current-price {
            font-size: 26px;
            font-weight: bold;
            color: #0ECB81;
        }
        /* 交易面板 */
        .trade-panel {
            display: flex;
            padding: 0 16px;
            gap: 16px;
        }
        .trade-form {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dir-tabs {
            display: flex;
            border-radius: 4px;
            background-color: #1F2630;
            padding: 2px;
        }
        .dir-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
        }
        .dir-tab.buy { background-color: #0ECB81; color: #fff; }
        .dir-tab.sell { color: #848E9C; }
        
        .row-options { display: flex; justify-content: space-between; gap: 8px; }
        .select-box {
            flex: 1; background-color: #1F2630; padding: 8px;
            border-radius: 4px; font-size: 12px; text-align: center; color: #EAECEF;
        }
        .input-group {
            background-color: #1F2630; border-radius: 4px;
            display: flex; align-items: center; padding: 0 10px;
        }
        .input-group input {
            width: 100%; background: transparent; border: none;
            outline: none; color: #EAECEF; padding: 10px 0; font-size: 14px;
        }
        .input-unit { font-size: 12px; color: #848E9C; margin-left: 4px; }
        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #848E9C; margin-top: 4px; }
        .info-value { color: #EAECEF; }
        
        .submit-btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 6px;
            background-color: #F0B90B; color: #12161A;
        }
        /* 右侧盘口 */
        .order-book { flex: 0.8; display: flex; flex-direction: column; font-size: 12px; }
        .book-header { display: flex; justify-content: space-between; color: #848E9C; margin-bottom: 6px; }
        .book-row { display: flex; justify-content: space-between; padding: 3px 0; }
        .book-row.ask .price { color: #F6465D; }
        .book-row.bid .price { color: #0ECB81; }
        .book-row .qty { color: #B7BDC6; }
    </style>
</head>
<body>

    <!-- 顶部状态栏及搜索 -->
    <div class="header">
        <div class="header-top">
            <div class="symbol-info">
                <span class="symbol-name" id="current-token">BTC / USDT</span>
                <span class="symbol-change" id="live-change">+0.00%</span>
            </div>
            <div onclick="window.location.href='login.html'" style="color: #F0B90B; cursor: pointer; font-size: 13px; font-weight: bold;">登录 / 注册</div>
        </div>
        <!-- 全球已知币种搜索框 -->
        <div class="search-box">
            <input type="text" id="crypto-search" placeholder="🔍 输入代币简称搜索全网代币 (例如: eth, sol, pepe)..." oninput="searchCrypto()">
        </div>
    </div>

    <div class="main-container">
        <!-- 实时行情区 -->
        <div class="chart-section">
            <div class="price-ticker">
                <div class="current-price" id="live-price">加载中...</div>
                <div style="font-size:12px; color:#848E9C;" id="live-usdt">≈ $--</div>
            </div>
            <div class="chart-placeholder">
                [ 简化交易行情 K 线图表区域 ]
            </div>
        </div>

        <!-- 交易面板 -->
        <div class="trade-panel">
            <div class="trade-form">
                <div class="dir-tabs">
                    <div class="dir-tab buy">买入开多</div>
                    <div class="dir-tab sell">卖出开空</div>
                </div>
                <div class="row-options">
                    <div class="select-box">限价单 ▾</div>
                    <div class="select-box">逐仓 20x ▾</div>
                </div>
                <div class="input-group">
                    <input type="number" id="form-price">
                    <span class="input-unit">USDT</span>
                </div>
                <div class="input-group">
                    <input type="number" placeholder="数量">
                    <span class="input-unit" id="form-unit">BTC</span>
                </div>
                <div class="info-section">
                    <div class="info-row">
                        <span>可用余额</span>
                        <span class="info-value"><a href="login.html" style="color:#F0B90B; text-decoration:none;">请先登录 ➔</a></span>
                    </div>
                </div>
                <button class="submit-btn" onclick="window.location.href='login.html'">请先登录账号</button>
            </div>

            <!-- 五档深度数据 -->
            <div class="order-book">
                <div class="book-header">
                    <span>价格(USDT)</span>
                    <span>数量</span>
                </div>
                <div id="asks-container"></div>
                <div style="margin: 6px 0; border-top: 1px dashed #2B3139;"></div>
                <div id="bids-container"></div>
            </div>
        </div>
    </div>

    <script>
        let currentCoinId = 'bitcoin'; 
        let currentSymbol = 'BTC';
        let lastPrice = 0;

        // 初始化加载默认币种行情
        async function fetchMarketData() {
            try {
                // 直接从公共API拉取目标代币的最新真实全球市场价、涨跌幅
                const response = await fetch(`https://coingecko.com{currentCoinId}&vs_currencies=usdt&include_24hr_change=true`);
                const data = await response.json();
                
                if (data[currentCoinId]) {
                    const price = data[currentCoinId].usdt;
                    const change = data[currentCoinId].usdt_24h_change || 0;
                    
                    // 格式化输出长短价格
                    const formattedPrice = price > 1 ? price.toFixed(2) : price.toFixed(6);
                    
                    document.getElementById('live-price').innerText = formattedPrice;
                    document.getElementById('live-usdt').innerText = `≈ $${formattedPrice}`;
                    
                    const formPriceInput = document.getElementById('form-price');
                    if(document.activeElement !== formPriceInput) {
                        formPriceInput.value = formattedPrice;
                    }

                    // 实时颜色渲染
                    const priceEl = document.getElementById('live-price');
                    if (lastPrice > 0) {
                        priceEl.style.color = price >= lastPrice ? '#0ECB81' : '#F6465D';
                    }
                    lastPrice = price;

                    // 渲染涨跌幅百分比
