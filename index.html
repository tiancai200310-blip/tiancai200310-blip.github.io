<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>行情中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #12161A; color: #EAECEF; font-size: 14px; padding-bottom: 70px; padding-top: env(safe-area-inset-top); }
        .tabs { display: flex; gap: 24px; padding: 16px; border-bottom: 1px solid #1F2630; background-color: #171E26; }
        .tab { font-size: 16px; color: #848E9C; font-weight: bold; cursor: pointer; position: relative; }
        .tab.active { color: #F0B90B; }
        .tab.active::after { content: ''; position: absolute; bottom: -17px; left: 0; width: 100%; height: 3px; background-color: #F0B90B; }
        
        .list-header { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 12px; color: #848E9C; border-bottom: 1px solid #1F2630; }
        .coin-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #1F2630; cursor: pointer; }
        .coin-left { display: flex; flex-direction: column; gap: 4px; }
        .coin-name { font-size: 16px; font-weight: bold; color: #FFF; }
        .coin-vol { font-size: 12px; color: #848E9C; }
        .coin-right { display: flex; align-items: center; gap: 20px; }
        .coin-price { font-size: 16px; font-weight: bold; text-align: right; }
        .coin-change { width: 80px; padding: 8px 0; text-align: center; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .up { background-color: rgba(14, 203, 129, 0.15); color: #0ECB81; }
        .down { background-color: rgba(246, 70, 93, 0.15); color: #F6465D; }
        
        /* 底部导航栏 */
        .footer-navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #171E26; border-top: 1px solid #1F2630; display: flex; justify-content: space-around; align-items: center; padding-top: 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #848E9C; text-decoration: none; }
        .nav-item.active { color: #F0B90B; }
        .nav-icon { font-size: 18px; }
        .nav-text { font-size: 11px; }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab">自选</div>
        <div class="tab active">现货大厅</div>
        <div class="tab">各类榜单</div>
    </div>

    <div class="list-header">
        <span>名称 / 24h成交量</span>
        <div style="display: flex; gap: 55px; margin-right: 20px;">
            <span>最新价</span>
            <span>24h涨跌</span>
        </div>
    </div>

    <!-- 真实数据渲染池 -->
    <div id="market-list">
        <div style="text-align: center; padding: 40px; color: #474D57;">正在极速同步全球链上交易流动性...</div>
    </div>

    <div class="footer-navbar">
        <a href="market.html" class="nav-item active"><span class="nav-icon">📊</span><span class="nav-text">行情</span></a>
        <a href="otc.html" class="nav-item"><span class="nav-icon">💳</span><span class="nav-text">法币交易</span></a>
        <a href="index.html" class="nav-item"><span class="nav-icon">📈</span><span class="nav-text">合约交易</span></a>
        <a href="recharge.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-text">资产</span></a>
    </div>

    <script>
        const coins = [
            { id: 'bitcoin', name: 'BTC', vol: '24.5B' },
            { id: 'ethereum', name: 'ETH', vol: '12.1B' },
            { id: 'solana', name: 'SOL', vol: '3.8B' },
            { id: 'ripple', name: 'XRP', vol: '1.2B' },
            { id: 'dogecoin', name: 'DOGE', vol: '950M' }
        ];

        async function getPrices() {
            try {
                const ids = coins.map(c => c.id).join(',');
                const res = await fetch(`https://coingecko.com{ids}&vs_currencies=usdt&include_24hr_change=true`);
                const data = await res.json();
                
                let html = '';
                coins.forEach(coin => {
                    const market = data[coin.id];
                    if(market) {
                        const price = market.usdt;
                        const change = market.usdt_24h_change || 0;
                        const cls = change >= 0 ? 'up' : 'down';
                        const sign = change >= 0 ? '+' : '';
                        
                        html += `
                            <div class="coin-row" onclick="window.location.href='index.html'">
                                <div class="coin-left">
                                    <span class="coin-name">${coin.name}/USDT</span>
                                    <span class="coin-vol">量 ${coin.vol}</span>
                                </div>
                                <div class="coin-right">
                                    <span class="coin-price" style="color: ${change >= 0 ? '#0ECB81' : '#F6465D'}">${price > 1 ? price.toFixed(2) : price.toFixed(4)}</span>
                                    <div class="coin-change ${cls}">${sign}${change.toFixed(2)}%</div>
                                </div>
                            </div>
                        `;
                    }
                });
                document.getElementById('market-list').innerHTML = html;
            } catch (e) {}
        }
        setInterval(getPrices, 3000);
        getPrices();
    </script>
</body>
</html>
